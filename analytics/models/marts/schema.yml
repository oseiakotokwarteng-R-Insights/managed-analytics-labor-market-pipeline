version: 2

models:
  - name: mart_county_year
    description: One row per county and year. Private-sector jobs, businesses and pay, and the change from the year before.
    tests:
      - unique_combination:
          arguments:
            columns: [area_fips, year]
    columns:
      - name: area_fips
        tests: [not_null]
      - name: state_name
        tests: [not_null]
      - name: employment
        description: Average jobs in the year. Empty when BLS hid it.
      - name: employment_change_pct
        description: Change in jobs from the previous calendar year, as a share. Empty when either year is missing or hidden.

  - name: mart_county_sector_year
    description: One row per county, sector and year, with the sector's share of the county's jobs.
    tests:
      - unique_combination:
          arguments:
            columns: [area_fips, year, industry_code]
    columns:
      - name: industry_title
        tests: [not_null]
      - name: employment_share_of_county
        description: Sector jobs divided by county jobs. Empty when either is hidden.
        tests: [non_negative]

  - name: mart_state_year
    description: One row per state and year. The BLS state total next to the sum of its counties.
    tests:
      - unique_combination:
          arguments:
            columns: [state_fips, year]
    columns:
      - name: bls_state_employment
        tests: [not_null]
      - name: county_sum_employment
        description: Jobs in the named counties. A county BLS hid is left out of the sum.
        tests: [not_null]
      - name: undefined_area_employment
        description: Jobs BLS could not place in any single county ("unknown or undefined"). Zero when there is no such row.
        tests: [non_negative]
      - name: gap_pct
        description: Counties plus that bucket, compared with the BLS state total, as a share of the total.
      - name: share_not_in_a_county
        description: How much of the state's jobs are in that bucket and so belong to no county.
