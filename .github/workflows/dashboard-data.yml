name: Dashboard data

# Runs the pipeline on the real BLS files and saves the files the dashboard reads on a branch called
# dashboard-data. It only runs when I start it by hand ("Run workflow"), because it downloads about
# 390 MB from BLS (one file per year, about 75 MB each).
#
# The branch holds nothing but the generated JSON files, which come from public data. A deploy script
# (deploy/deploy_dashboard.ps1) builds the website from the dashboard folder plus that branch.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Which region: dmv (DC, Maryland, Virginia) or california"
        default: "dmv"

permissions:
  contents: write

jobs:
  dashboard-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Run the pipeline on the real data
        env:
          QCEW_REGION: ${{ github.event.inputs.region }}
          QCEW_DB_PATH: ${{ runner.temp }}/qcew.sqlite
          QCEW_RAW_DIR: ${{ runner.temp }}/raw
          QCEW_OUTPUT_DIR: ${{ runner.temp }}/out
        run: qcew-run
      - name: Write the dashboard files
        env:
          QCEW_REGION: ${{ github.event.inputs.region }}
          QCEW_DB_PATH: ${{ runner.temp }}/qcew.sqlite
        run: qcew-dashboard --out site/data
      - name: Show what was written
        run: |
          ls -la site/data
          du -sh site/data
          python -c "import json; m = json.load(open('site/data/meta.json')); print(m['region_name'], m['years'], m['last_run'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-run
          path: |
            ${{ runner.temp }}/out
            site/data
      - name: Save the files on the dashboard-data branch
        run: |
          cd site
          cat > README.md <<'EOF'
          # Dashboard data

          Generated files for the Labor Market Explorer. They come from public data published by the U.S. Bureau
          of Labor Statistics (QCEW), run through the pipeline in the main branch. Nothing here is edited by hand.
          EOF
          git init -q -b dashboard-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dashboard data from run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dashboard-data
