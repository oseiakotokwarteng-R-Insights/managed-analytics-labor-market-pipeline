name: QCEW pipeline

# What happens here:
#   1. Every push and pull request is checked: style (ruff), types (mypy), the automated tests,
#      and that the Docker image builds and starts.
#   2. Once a month, a quick check asks BLS which annual file is newest. If there is a year we have
#      not announced yet, the workflow opens a GitHub issue (once per year) so the news doesn't sit in a log.
#   3. If I click "Run workflow" by hand, it runs the real pipeline and saves the log, validation
#      results and database as a downloadable artifact.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 14 1 * *"      # 14:00 UTC on the first of each month
  workflow_dispatch:
    inputs:
      years:
        description: "Years to run, for example 2025 or '2024 2025'. Leave empty for the full window."
        default: ""

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Style and common mistakes
        run: ruff check . --output-format=github
      - name: Formatting
        run: |
          status=0
          ruff format --check . > format.txt 2>&1 || status=$?
          cat format.txt
          sed -n 's/^Would reformat: \(.*\)$/::error file=::Not formatted the way ruff format writes it/p' format.txt
          exit $status

  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Type check
        run: |
          status=0
          mypy --no-color-output --no-error-summary > mypy.txt 2>&1 || status=$?
          cat mypy.txt
          sed -n -E 's#^([^:]+):([0-9]+): error: (.*)$#::error file=,line=::#p' mypy.txt
          exit $status

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qcew-pipeline .
      - name: The program starts
        run: docker run --rm qcew-pipeline --help
      - name: The settings file and database layout were installed with the package
        run: >
          docker run --rm --entrypoint python qcew-pipeline -c
          "from qcew_pipeline import load; from qcew_pipeline.config import DEFAULT_CONFIG;
          assert load.SCHEMA_FILE.is_file() and DEFAULT_CONFIG.is_file(); print('package files present')"

  check-for-new-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - id: check
        run: qcew-check-updates
      - name: Open an issue if there is new data
        if: steps.check.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ steps.check.outputs.year }}
          WINDOW: ${{ steps.check.outputs.window }}
        run: |
          title="QCEW annual file available: $YEAR"
          # --state all: one issue per year, ever, even after the issue has been closed
          existing=$(gh issue list --state all --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body "BLS has published the $YEAR annual QCEW file. The pipeline follows the newest year automatically, so the next run (\`qcew-run --export\`) will pull $WINDOW. The usual checks run before anything is saved. This issue was opened automatically by the monthly check."
          else
            echo "An issue for $YEAR already exists. Nothing to do."
          fi

  run-pipeline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Run the pipeline
        env:
          YEARS: ${{ github.event.inputs.years }}
          QCEW_DB_PATH: ${{ runner.temp }}/qcew_ci.sqlite
          QCEW_RAW_DIR: ${{ runner.temp }}/raw
          QCEW_OUTPUT_DIR: ${{ runner.temp }}/out
        run: |
          args=""
          if [ -n "$YEARS" ]; then args="--years $YEARS"; fi
          qcew-run $args --export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-run
          path: |
            ${{ runner.temp }}/out
            ${{ runner.temp }}/qcew_ci.sqlite
