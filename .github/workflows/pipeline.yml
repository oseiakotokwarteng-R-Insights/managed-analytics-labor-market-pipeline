name: QCEW pipeline

# Three things happen here:
#   1. Every push and pull request runs the automated tests.
#   2. Once a month, a quick check asks BLS whether a newer annual file has been published.
#      If it has, the workflow opens a GitHub issue (once) so the news doesn't sit in a log.
#   3. If I click "Run workflow" by hand, it runs the real pipeline for one year and
#      saves the log, validation results and database as a downloadable artifact.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 14 1 * *"      # 14:00 UTC on the first of each month
  workflow_dispatch:
    inputs:
      year:
        description: "Year to run through the pipeline"
        default: "2024"

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  check-for-new-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: python -m qcew_pipeline.check_updates
      - name: Open an issue if there is new data
        if: steps.check.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ steps.check.outputs.year }}
          WINDOW: ${{ steps.check.outputs.window }}
        run: |
          title="QCEW annual file available: $YEAR"
          # --state all: one issue per year, ever, even after the issue has been closed
          existing=$(gh issue list --state all --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body "BLS has published the $YEAR annual QCEW file. The pipeline follows the newest year automatically, so the next run (\`python -m qcew_pipeline.run --export\`) will pull $WINDOW. The usual checks run before anything is saved. This issue was opened automatically by the monthly check."
          else
            echo "An issue for $YEAR already exists. Nothing to do."
          fi

  run-pipeline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the pipeline for one year
        run: python -m qcew_pipeline.run --years ${{ github.event.inputs.year }} --export
        env:
          QCEW_DB_PATH: ${{ runner.temp }}/qcew_ci.sqlite
          QCEW_RAW_DIR: ${{ runner.temp }}/raw
          QCEW_OUTPUT_DIR: ${{ runner.temp }}/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-run-${{ github.event.inputs.year }}
          path: |
            ${{ runner.temp }}/out
            ${{ runner.temp }}/qcew_ci.sqlite
